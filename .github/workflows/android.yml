name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Make sure the Android SDK has our platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Unit tests
        run: gradle :app:test --no-daemon --stacktrace

      - name: Assemble APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Verify the release APK is signed with the project key
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee apksigner.txt
          grep -q "CN=Hermes Pocket" apksigner.txt

      - name: Assert every manifest component exists in the APK
        # A declared class that no artifact ships kills the app before its first
        # frame (providers and the Application are instantiated first). This is how
        # a missing Shizuku provider artifact was caught.
        run: python3 tools/check_components.py app/build/outputs/apk/release/app-release.apk

      - name: Assert the app bundles no browser
        # External links must go to the phone's own default browser. A Custom
        # Tabs or WebView-browser dependency creeping back in would change that
        # (and would hard-prefer Chrome), so fail the build if one is present.
        run: |
          python3 - <<'PY'
          import re, sys, zipfile
          apk = "app/build/outputs/apk/release/app-release.apk"
          with zipfile.ZipFile(apk) as z:
              dex = b"".join(z.read(n) for n in z.namelist() if n.startswith("classes") and n.endswith(".dex"))
          banned = [b"androidx/browser/customtabs", b"android/support/customtabs", b"com/android/chrome"]
          found = [b.decode() for b in banned if b in dex]
          print("dex bytes:", len(dex), "| banned:", found)
          if found:
              print("FAIL: a browser/Custom-Tabs dependency is bundled:", found)
              sys.exit(1)
          print("OK: no browser bundled, external links use the system default")
          PY

      - name: Collect build outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/hermes-pocket-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/hermes-pocket-debug.apk
          cd out && sha256sum *.apk | tee SHA256SUMS.txt && ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: out/hermes-pocket-debug.apk
          if-no-files-found: error

  e2e:
    name: Emulator smoke (setup screen, saved server, real page load)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: apk

      - name: Run smoke suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 4096
          script: bash .github/e2e.sh

      - name: Emulator logcat
        if: always()
        run: |
          adb devices || true
          # A wedged emulator must not hang this step for an hour.
          timeout 120 adb logcat -d -v threadtime > logcat-full.txt 2>&1 || true
          timeout 60 adb logcat -d -b crash > logcat-crash.txt 2>&1 || true
          wc -l logcat-full.txt logcat-crash.txt || true
          ls -la logcat-full.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidence
          path: |
            logcat-full.txt
            logcat-crash.txt
            e2e-*.txt
            settings*.xml
            screenshots/*.png
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: out

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Hermes Pocket ${{ steps.tag.outputs.tag }}
          files: out/*
          generate_release_notes: true
          body: |
            Hermes Pocket is a thin native Android shell for your own Hermes Agent web app.
            Point it at your address on the first launch (IP and port, or your public URL)
            and it keeps the sign-in session, supports microphone and file uploads,
            downloads, pull-to-refresh, back navigation and updates itself from GitHub
            Releases. External links open in whatever browser you set as the default.

            **Install:** download `hermes-pocket-release.apk`, open it on the phone and
            allow "install unknown apps" when prompted.

            `hermes-pocket-debug.apk` is the same app with the CI smoke hooks enabled.
